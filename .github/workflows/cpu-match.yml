name: cpu-match

# x86_64 と arm64（Raspberry Pi と同じ aarch64）の両方で、全サンプルの読み取りが途中の値まで
# recognizer/cpu_reference.json と同じかを確かめる（TODO-046）。recognizer を変えた PR は
# `uv run python recognizer/trace_cpu.py --update` で基準を書き直して同じ PR に入れる。
on:
  pull_request:
    paths: [pyproject.toml, uv.lock, recognizer/**, samples/**, .github/workflows/cpu-match.yml]
  push:
    branches: [main]
    paths: [pyproject.toml, uv.lock, recognizer/**, samples/**, .github/workflows/cpu-match.yml]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python recognizer/trace_cpu.py check 2>&1 | tee check.txt; exit ${PIPESTATUS[0]}
        shell: bash
      # 結果を注釈にも出す（ログを開かなくても、PR の画面や API から読める）
      - if: always()
        run: |
          [ -f check.txt ] || exit 0
          body=$(tail -n 40 check.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=cpu-match ${{ runner.arch }}::${body}"
