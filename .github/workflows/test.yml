name: test

on:
  push:
    # claude/** は担当のブランチ。PR なしで main に取り込む前に確かめる（TODO-180）
    # 自動の取り込み（recognizer/import_collected.py）のブランチは PR で走るので除く
    branches: [main, 'claude/**', '!claude/collected-import-**']
    # 文書だけの変更では走らせない（TODO-064）
    paths-ignore: ['**.md', 'docs/**', 'archives/**']
  pull_request:
    # PR は自動の取り込みが作る
    paths-ignore: ['**.md', 'docs/**', 'archives/**']

jobs:
  pytest:
    # arm64（Pi の gnubg の wheel）は毎回流さない。依存を変えた PR で Pi の確認を足す（TODO-075）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest analyzer
      # Pi と同じ起動のしかた（bganalyzer.service）で、起動して解析・写真認識まで通るか（TODO-056）
      - name: 起動して解析・写真認識を試す
        run: |
          .venv/bin/uvicorn app:app --app-dir analyzer --port 8000 --workers 1 > uvicorn.log 2>&1 &
          for i in $(seq 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fsS -X POST localhost:8000/analyze -H 'content-type: application/json' \
            -d '{"position_id": "4HPwATDgc/ABMA"}' | tee analyze.json
          python3 -c "import json; r = json.load(open('analyze.json')); assert 'summary' in r, r"
          corners=$(python3 -c "import json; t = json.load(open('samples/screen-app-grey-shot.truth.json')); print(','.join(str(v) for p in t['corners_TL_TR_BR_BL'] for v in p))")
          curl -fsS -X POST localhost:8000/analyze-photo -F image=@samples/screen-app-grey-shot.png \
            -F corners=$corners -F home=left -F bottom_colour=1 | tee photo.json
          python3 -c "import json; r = json.load(open('photo.json')); assert r['analysis'], r"
          curl -fs localhost:8000/ | grep -q '<html'
          curl -fsS localhost:8000/version | tee version.json
          python3 -c "import json; v = json.load(open('version.json')); assert v['analyzer'] and v['recognizer'] and v['commit'], v"
      - if: failure()
        run: cat uvicorn.log || true
