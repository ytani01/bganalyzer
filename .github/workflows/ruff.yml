name: ruff

on:
  push:
    # claude/** は担当のブランチ。PR なしで main に取り込む前に確かめる（TODO-180）
    # 自動の取り込み（recognizer/import_collected.py）のブランチは PR で走るので除く
    branches: [main, 'claude/**', '!claude/collected-import-**']
    # Python と ruff の設定を変えたときだけ走らせる（TODO-168）
    paths: ['**.py', 'pyproject.toml', 'uv.lock', '.github/workflows/ruff.yml']
  pull_request:
    # PR は自動の取り込みが作る
    paths: ['**.py', 'pyproject.toml', 'uv.lock', '.github/workflows/ruff.yml']

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
