name: ruff

on:
  push:
    # claude/** は担当のブランチ。PR なしで main に取り込む前に確かめる（TODO-180）
    branches: [main, 'claude/**']
  pull_request:
    # Python と ruff の設定を変えた PR だけ走らせる（TODO-168）。
    # PR は自動の取り込み（recognizer/import_collected.py）が作る
    paths: ['**.py', 'pyproject.toml', 'uv.lock', '.github/workflows/ruff.yml']

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
